<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #menu {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.85); color: #222;
            padding: 10px 14px; border-radius: 6px; font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        input { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; width: 130px; }
        button { padding: 4px 10px; background: #2b2b2b; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        #dot {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(0,0,0,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="menu">
    <div>ID: <b id="my-id">...</b></div>
    <div style="margin-top: 6px;">
        <input type="text" id="friend-id" placeholder="ID друга">
        <button onclick="connect()">OK</button>
    </div>
    <div id="status" style="margin-top: 4px; color: #555; font-size: 11px;">WASD — ходити | Shift — біг | Space — стрибок</div>
</div>
<div id="dot"></div>

<script>
    // 1. СВІТЛА СЦЕНА ТА НЕБО
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Ясне небо

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Денне освітлення
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.1);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(30, 50, 20);
    scene.add(sunLight);

    // 2. ПЛАТФОРМА (BASEPLATE)
    const floorSize = 80;
    const floorGeo = new THREE.BoxGeometry(floorSize, 1, floorSize);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x6b6e70 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.5;
    scene.add(floor);

    const grid = new THREE.GridHelper(floorSize, 40, 0x444444, 0x555555);
    grid.position.y = 0.01;
    scene.add(grid);

    // 3. ФІЗИКА ТА КЕРУВАННЯ ЯК У ROBLOX
    const player = {
        x: 0, y: 1.7, z: 5,
        vx: 0, vy: 0, vz: 0,
        eyeHeight: 1.7,
        walkSpeed: 0.14,
        runSpeed: 0.26,
        jumpForce: 0.25,
        gravity: 0.012,
        onGround: true
    };

    let yaw = 0, pitch = 0;
    const keys = {};

    renderer.domElement.addEventListener('click', () => {
        renderer.domElement.requestPointerLock();
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.0022;
            pitch -= e.movementY * 0.0022;
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
        }
    });

    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
        }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    // 4. МУЛЬТИПЛЕЄР З ФІКСОВАНИМ ID
    const HOST_ID = 'ut2uep-baseplate-host';
    let peer = new Peer(HOST_ID);
    let conn = null;

    // Аватар друга (простий стилізований чоловічок)
    const friendGroup = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2b65ec }));
    torso.position.y = 0.9;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xf5cd30 }));
    head.position.y = 1.7;
    friendGroup.add(torso, head);
    friendGroup.visible = false;
    scene.add(friendGroup);

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    // Якщо ID хоста вже зайнятий (наприклад, ти зайшов другим), створюємо звичайний ID
    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('friend-id').value = HOST_ID;
            });
            peer.on('connection', (c) => { conn = c; setupConn(); });
        }
    });

    peer.on('connection', (c) => { conn = c; setupConn(); });

    function connect() {
        const fid = document.getElementById('friend-id').value.trim();
        if (fid) {
            conn = peer.connect(fid);
            setupConn();
        }
    }

    function setupConn() {
        document.getElementById('status').innerText = "Гравець підключений";
        friendGroup.visible = true;
        conn.on('data', (data) => {
            friendGroup.position.set(data.x, data.y - player.eyeHeight, data.z);
            friendGroup.rotation.y = data.ry;
        });
    }

    // 5. ІГРОВИЙ ЦИКЛ
    function animate() {
        requestAnimationFrame(animate);

        // Вибір швидкості (Shift = біг)
        const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? player.runSpeed : player.walkSpeed;

        // Напрямок руху
        const input = new THREE.Vector3();
        if (keys['KeyW']) input.z -= 1;
        if (keys['KeyS']) input.z += 1;
        if (keys['KeyA']) input.x -= 1;
        if (keys['KeyD']) input.x += 1;

        if (input.length() > 0) {
            input.normalize();
            input.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            player.vx = input.x * speed;
            player.vz = input.z * speed;
        } else {
            // Плавне гальмування як у Roblox
            player.vx *= 0.7;
            player.vz *= 0.7;
        }

        // Гравітація та стрибок
        player.vy -= player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.z += player.vz;

        // Колізія з підлогою
        if (player.y <= player.eyeHeight) {
            player.y = player.eyeHeight;
            player.vy = 0;
            player.onGround = true;
        }

        // Межі платформи
        const limit = floorSize / 2 - 1;
        player.x = Math.max(-limit, Math.min(limit, player.x));
        player.z = Math.max(-limit, Math.min(limit, player.z));

        // Оновлення камери
        camera.position.set(player.x, player.y, player.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Відправка даних другу
        if (conn && conn.open) {
            conn.send({ x: player.x, y: player.y, z: player.z, ry: yaw });
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
