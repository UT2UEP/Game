<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif;color:#fff;user-select:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,5,20,.75);z-index:10}
.box{background:#12142a;border:1px solid #3b3f7a;border-radius:14px;padding:26px 30px;width:340px;text-align:center}
h1{margin:0 0 4px;font-size:28px;letter-spacing:2px}.sub{opacity:.6;font-size:13px;margin-bottom:16px}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #444a99;background:#0a0c1e;color:#fff;font-size:15px;text-align:center}
button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:8px;background:#5b6cff;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#7483ff}button.alt{background:#2a2e66}
#st{min-height:18px;font-size:13px;color:#ffd166;margin-top:8px}
.help{font-size:12px;opacity:.65;margin-top:12px;line-height:1.5}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:9px;top:0;width:2px;height:20px;-webkit-mask:linear-gradient(#000 35%,transparent 35%,transparent 65%,#000 65%);mask:linear-gradient(#000 35%,transparent 35%,transparent 65%,#000 65%)}
#cross:after{top:9px;left:0;height:2px;width:20px;-webkit-mask:linear-gradient(90deg,#000 35%,transparent 35%,transparent 65%,#000 65%);mask:linear-gradient(90deg,#000 35%,transparent 35%,transparent 65%,#000 65%)}
#cross.hit:before,#cross.hit:after{background:#f44}
#hp{position:absolute;left:20px;bottom:20px;width:220px;height:20px;background:#0008;border:2px solid #fff6;border-radius:6px;overflow:hidden}
#hpb{height:100%;width:100%;background:linear-gradient(90deg,#e33,#4d4);transition:width .15s}
#info{position:absolute;right:16px;top:12px;text-align:right;font-size:13px;text-shadow:0 0 4px #000;line-height:1.6}
#feed{position:absolute;left:16px;top:12px;font-size:13px;text-shadow:0 0 4px #000;line-height:1.5}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px #f00;opacity:0;transition:opacity .35s}
</style></head><body>

<div id="menu" class="ov"><div class="box">
<h1>SPACE ARENA</h1><div class="sub">P2P шутер від 1-ї особи</div>
<input id="nick" maxlength="12" placeholder="Твій нікнейм">
<button id="bHost">Створити кімнату</button>
<input id="code" maxlength="5" placeholder="Код кімнати від друга">
<button id="bJoin" class="alt">Приєднатися</button>
<button id="bSolo" class="alt">Грати наодинці</button>
<div id="st"></div>
<div class="help">WASD — рух · Shift — біг · Пробіл — стрибок<br>Миша — огляд · ЛКМ — стрільба · Esc — пауза · G — графіка</div>
</div></div>

<div id="pause" class="ov" style="display:none;cursor:pointer"><div class="box"><h1>ПАУЗА</h1><div class="sub">Клікни, щоб повернутись у гру</div><div id="codeShow" style="font-size:22px;letter-spacing:4px;color:#ffd166"></div></div></div>

<div id="hud"><div id="hurt"></div><div id="cross"></div><div id="hp"><div id="hpb"></div></div><div id="feed"></div><div id="info"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// ---------- сцена ----------
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio,1.5);renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x060818);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,600);camera.rotation.order='YXZ';
scene.add(camera);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(window.composer)resizeFX()});

const SRGB=THREE.sRGBEncoding;
scene.fog=new THREE.FogExp2(0x0b0e2a,.009);
scene.add(new THREE.HemisphereLight(0x9db4ff,0x2a2038,.45));
const sun=new THREE.DirectionalLight(0xfff0dd,2.4);sun.position.set(45,70,30);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-62,right:62,top:62,bottom:-62,near:10,far:200});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;scene.add(sun);
const rim=new THREE.DirectionalLight(0x5a7bff,.8);rim.position.set(-40,25,-35);scene.add(rim);

// небо (space.jpg) + відображення неба на металі (PMREM)
const pm=new THREE.PMREMGenerator(renderer);
function cv(s){const c=document.createElement('canvas');c.width=c.height=s;return c}
function tex(c,enc){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(enc)t.encoding=enc;return t}
function grunge(g,s,base,amp){const d=g.createImageData(s,s);for(let i=0;i<d.data.length;i+=4){const v=base+(Math.random()-.5)*amp;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)}
function starTex(){const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#05061a');gr.addColorStop(.5,'#1a1440');gr.addColorStop(1,'#05061a');g.fillStyle=gr;g.fillRect(0,0,1024,512);for(let i=0;i<500;i++){g.fillStyle='rgba(255,255,255,'+Math.random()+')';g.fillRect(Math.random()*1024,Math.random()*512,1.5,1.5)}return new THREE.CanvasTexture(c)}
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,48,32),new THREE.MeshBasicMaterial({side:THREE.BackSide,depthWrite:false,fog:false}));
scene.add(sky);
function applySky(t){t.encoding=SRGB;sky.material.map=t;sky.material.needsUpdate=true;const e=t.clone();e.mapping=THREE.EquirectangularReflectionMapping;e.needsUpdate=true;scene.environment=pm.fromEquirectangular(e).texture}
applySky(starTex());
new THREE.TextureLoader().load('space.jpg',applySky,undefined,()=>console.warn('space.jpg не знайдено'));

// процедурні PBR-текстури: підлога
const SIZE=80,H=SIZE/2,FS=512,fc=cv(FS),fb=cv(FS),fe=cv(FS);
{const g=fc.getContext('2d'),b=fb.getContext('2d'),e=fe.getContext('2d');
grunge(g,FS,75,60);grunge(b,FS,128,70);g.fillStyle='rgba(30,45,110,.45)';g.fillRect(0,0,FS,FS);
for(let i=0;i<90;i++){g.strokeStyle='rgba(255,255,255,'+Math.random()*.08+')';g.beginPath();const x=Math.random()*FS,y=Math.random()*FS;g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*90,y+(Math.random()-.5)*90);g.stroke()}
g.strokeStyle='#05060f';b.strokeStyle='#000';g.lineWidth=b.lineWidth=4;
for(const k of[0,256])for(const x of[g,b]){x.beginPath();x.moveTo(k,0);x.lineTo(k,FS);x.moveTo(0,k);x.lineTo(FS,k);x.stroke()}
e.fillStyle='#000';e.fillRect(0,0,FS,FS);e.strokeStyle='#27d9ff';e.lineWidth=5;e.strokeRect(0,0,FS,FS)}
const fT=[tex(fc,SRGB),tex(fb),tex(fe,SRGB)];fT.forEach(t=>t.repeat.set(SIZE/8,SIZE/8));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE),new THREE.MeshStandardMaterial({map:fT[0],bumpMap:fT[1],bumpScale:.7,roughnessMap:fT[1],roughness:.75,metalness:.35,emissiveMap:fT[2],emissive:0x27d9ff,emissiveIntensity:1.6,envMapIntensity:.8}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// текстура металевих панелей
const PS=256,pc=cv(PS),pbm=cv(PS);
{const g=pc.getContext('2d'),b=pbm.getContext('2d');grunge(g,PS,200,50);grunge(b,PS,140,40);
for(const x of[g,b]){x.strokeStyle=x===g?'#222':'#000';x.lineWidth=6;x.strokeRect(3,3,PS-6,PS-6);x.lineWidth=2;x.strokeRect(20,20,PS-40,PS-40);x.fillStyle=x===g?'#444':'#fff';for(const[a,c]of[[32,32],[224,32],[32,224],[224,224]]){x.beginPath();x.arc(a,c,5,0,7);x.fill()}}}
const pT=tex(pc,SRGB),pB=tex(pbm);

// перешкоди (однакові у всіх гравців — детермінована генерація)
const boxes=[],worldMeshes=[floor];
function addBox(x,y,z,w,h,d,col,emi){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dm[f][0]/3,uv.getY(i)*dm[f][1]/3)}
  const m=new THREE.Mesh(g,emi?new THREE.MeshStandardMaterial({color:0,emissive:col,emissiveIntensity:emi}):new THREE.MeshStandardMaterial({color:col,map:pT,bumpMap:pB,bumpScale:.5,roughness:.42,metalness:.6,envMapIntensity:1}));
  m.position.set(x,y+h/2,z);m.castShadow=m.receiveShadow=!emi;scene.add(m);worldMeshes.push(m);
  if(!emi)boxes.push({minx:x-w/2,maxx:x+w/2,miny:y,maxy:y+h,minz:z-d/2,maxz:z+d/2});
}
// стіни арени
const wc=0x1c1f40;
addBox(0,0,-H-1,SIZE+4,12,2,wc);addBox(0,0,H+1,SIZE+4,12,2,wc);addBox(-H-1,0,0,2,12,SIZE,wc);addBox(H+1,0,0,2,12,SIZE,wc);
let seed=12345;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=[0xff5964,0xffb627,0x38b000,0x38a3ff,0xa05cff,0xff7bd0,0x00d4c0];
for(let i=0;i<26;i++){
  const w=2+rnd()*5,d=2+rnd()*5,h=1+rnd()*4;
  const x=(rnd()-.5)*(SIZE-14),z=(rnd()-.5)*(SIZE-14);
  if(Math.hypot(x,z)<6)continue;
  addBox(x,0,z,w,h,d,cols[i%cols.length]);
}
// центральна башта зі сходами
addBox(0,0,0,6,1,6,0xffffff);addBox(0,1,0,4,1,4,0xdddddd);addBox(0,2,0,2,1,2,0xbbbbbb);
for(let i=0;i<5;i++)addBox(5+i*1.4,0,0,1.4,.5*(i+1),3,0x8ea0ff);

// неонове освітлення арени
const nc=[0x27d9ff,0xff3da8,0x7cff5a,0xffb627],strip=(x,y,z,w,h,d,c)=>addBox(x,y,z,w,h,d,c,4);
strip(0,11.7,-H+.1,SIZE,.25,.2,nc[0]);strip(0,11.7,H-.1,SIZE,.25,.2,nc[1]);strip(-H+.1,11.7,0,.2,.25,SIZE,nc[2]);strip(H-.1,11.7,0,.2,.25,SIZE,nc[3]);
[[-30,-30,0],[30,-30,1],[30,30,2],[-30,30,3]].forEach(([x,z,i])=>{addBox(x,0,z,1.4,8,1.4,0x1b1e3a);strip(x,8,z,1.8,.5,1.8,nc[i]);const l=new THREE.PointLight(nc[i],2.5,34,1.6);l.position.set(x,7,z);scene.add(l)});
strip(0,3,0,2,.1,2,nc[0]);{const l=new THREE.PointLight(nc[0],2,30,1.6);l.position.set(0,2.6,2.2);scene.add(l)}

// ---------- аватари ----------
const remoteMeshes=[];
function makeAvatar(id,name,hue){
  const g=new THREE.Group(),c=new THREE.Color().setHSL(hue,.7,.5);
  const mat=new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.3}),skin=new THREE.MeshStandardMaterial({color:0xffd9a0,roughness:.7});
  const parts=[];
  const add=(w,h,d,x,y,z,m)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);p.position.set(x,y,z);p.userData.pid=id;p.castShadow=true;g.add(p);remoteMeshes.push(p);parts.push(p);return p};
  const legL=add(.3,.6,.3,-.17,.3,0,new THREE.MeshStandardMaterial({color:0x2b3a67,roughness:.6}));
  const legR=add(.3,.6,.3,.17,.3,0,legL.material);
  add(.7,.7,.4,0,.95,0,mat);
  add(.4,.4,.4,0,1.5,0,skin);
  add(.2,.65,.2,-.45,.95,0,skin);
  add(.2,.2,.7,.45,1.05,-.3,new THREE.MeshStandardMaterial({color:0x222222,metalness:.9,roughness:.3}));
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const x=cv.getContext('2d');x.font='bold 34px system-ui';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000';x.strokeText(name,128,44);x.fillStyle='#fff';x.fillText(name,128,44);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));
  sp.scale.set(2,.5,1);sp.position.y=2.1;sp.renderOrder=9;g.add(sp);
  scene.add(g);
  return{g,parts,legL,legR,tp:new THREE.Vector3(),tyaw:0,last:performance.now(),name,phase:0};
}
function removePlayer(id){
  const r=remotes[id];if(!r)return;
  scene.remove(r.g);for(let i=remoteMeshes.length-1;i>=0;i--)if(remoteMeshes[i].userData.pid===id)remoteMeshes.splice(i,1);
  delete remotes[id];feed(r.name+' вийшов');updInfo();
}

// ---------- мережа (PeerJS, WebRTC P2P) ----------
const remotes={},conns={};let peer=null,isHost=false,myId='solo',roomCode='',inGame=false;
const myHue=Math.random(),PFX='spacearena-';
function setup(c){
  c.on('open',()=>{conns[c.peer]=c;$('st').textContent='';});
  c.on('data',d=>onData(c,d));
  c.on('close',()=>{
    delete conns[c.peer];
    if(isHost){removePlayer(c.peer);relay(null,{t:'l',id:c.peer})}
    else{feed('Зʼєднання з хостом втрачено');Object.keys(remotes).forEach(removePlayer)}
  });
}
function relay(from,d){for(const k in conns)if(conns[k]!==from&&conns[k].open)conns[k].send(d)}
function send(d){for(const k in conns)if(conns[k].open)conns[k].send(d)}
function onData(c,d){
  const id=d.id||c.peer;
  if(isHost&&d.t!=='l')relay(c,{...d,id});
  if(d.t==='s'){
    let r=remotes[id];
    if(!r){r=remotes[id]=makeAvatar(id,d.n,d.h);r.g.position.set(...d.p);feed(d.n+' приєднався');updInfo()}
    r.tp.set(...d.p);r.tyaw=d.y;r.last=performance.now();
  }else if(d.t==='l'){removePlayer(id)}
  else if(d.t==='f'){tracer(new THREE.Vector3(...d.o),new THREE.Vector3(...d.e),0xffee88);beep(300,.05,.04);burst(new THREE.Vector3(...d.e))}
  else if(d.t==='h'&&d.to===myId){damage(d.dmg,d.n)}
  else if(d.t==='k'){feed(`${d.a} ✦ ${d.v}`)}
}
function err(e){$('st').textContent=e.type==='peer-unavailable'?'Кімнату не знайдено. Перевір код.':'Помилка мережі: '+(e.type||e.message)}
$('bHost').onclick=()=>{
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';roomCode='';for(let i=0;i<5;i++)roomCode+=A[Math.random()*A.length|0];
  $('st').textContent='Створюю кімнату…';
  peer=new Peer(PFX+roomCode);peer.on('error',err);
  peer.on('open',id=>{myId=id;isHost=true;peer.on('connection',setup);start()});
};
$('bJoin').onclick=()=>{
  const code=$('code').value.trim().toUpperCase();if(!code){$('st').textContent='Введи код кімнати';return}
  $('st').textContent='Зʼєднання…';roomCode=code;
  peer=new Peer();peer.on('error',err);
  peer.on('open',id=>{myId=id;const c=peer.connect(PFX+code,{reliable:false});setup(c);c.on('open',start)});
};
$('bSolo').onclick=()=>{roomCode='';start()};

// ---------- гравець ----------
const me={p:new THREE.Vector3(0,0,20),vy:0,yaw:0,pitch:0,hp:100,ground:false,name:'Гравець'};
const R=.4,HT=1.75,EYE=1.6;
function spawn(){
  const a=Math.random()*Math.PI*2,d=25+Math.random()*10;
  me.p.set(Math.cos(a)*d,0,Math.sin(a)*d);me.vy=0;me.yaw=Math.atan2(me.p.x,me.p.z);me.pitch=0;me.hp=100;$('hpb').style.width='100%';
}
function hits(p){
  for(const b of boxes)if(p.x+R>b.minx&&p.x-R<b.maxx&&p.z+R>b.minz&&p.z-R<b.maxz&&p.y<b.maxy-.05&&p.y+HT>b.miny)return true;
  return false;
}
function start(){
  me.name=($('nick').value.trim()||'Гравець'+(Math.random()*90+10|0)).slice(0,12);
  spawn();inGame=true;$('menu').style.display='none';$('hud').style.display='block';
  $('codeShow').textContent=roomCode?'КОД: '+roomCode:'';
  updInfo();lockPointer();
}
function lockPointer(){renderer.domElement.requestPointerLock()}
var skipM=0;
document.addEventListener('pointerlockchange',()=>{skipM=4;
  const l=document.pointerLockElement===renderer.domElement;
  $('pause').style.display=(!l&&inGame)?'flex':'none';
});
$('pause').onclick=lockPointer;
const keys={};let mouseDown=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',e=>{if(e.button===0&&document.pointerLockElement)mouseDown=true});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  if(skipM>0){skipM--;return}
  const mx=Math.abs(e.movementX)>120?0:e.movementX,my=Math.abs(e.movementY)>120?0:e.movementY;
  me.yaw-=mx*.0022;me.pitch=Math.max(-1.55,Math.min(1.55,me.pitch-my*.0022));
});

// ---------- стрільба ----------
const ray=new THREE.Raycaster();ray.far=200;let cool=0;const tracers=[];
let actx;function beep(f,d,v){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.setValueAtTime(f,actx.currentTime);o.frequency.exponentialRampToValueAtTime(f/3,actx.currentTime+d);g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function tracer(a,b,col){
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,a.distanceTo(b),5),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(5),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  l.position.copy(a).add(b).multiplyScalar(.5);
  l.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
  scene.add(l);tracers.push({l,t:.12});
}
const SN=300,spP=new Float32Array(SN*3).fill(-999),spV=new Float32Array(SN*3),spL=new Float32Array(SN);let si=0;
const spG=new THREE.BufferGeometry();spG.setAttribute('position',new THREE.BufferAttribute(spP,3));
const sparks=new THREE.Points(spG,new THREE.PointsMaterial({color:new THREE.Color(0xffa040).multiplyScalar(4),size:.09,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
sparks.frustumCulled=false;scene.add(sparks);
function burst(p){for(let k=0;k<14;k++){const i=si++%SN;spP.set([p.x,p.y,p.z],i*3);spV.set([(Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6],i*3);spL[i]=.3+Math.random()*.4}}
function shoot(){
  const o=camera.position.clone(),d=new THREE.Vector3();camera.getWorldDirection(d);
  ray.set(o,d);
  const h=ray.intersectObjects([...worldMeshes,...remoteMeshes],false)[0];
  const end=h?h.point:o.clone().addScaledVector(d,100);
  const muzzle=new THREE.Vector3();gunTip.getWorldPosition(muzzle);
  tracer(muzzle,end,0xffee88);beep(500,.07,.05);flashLight.intensity=9;recoil=1;burst(end);
  send({t:'f',o:muzzle.toArray(),e:end.toArray()});
  if(h&&h.object.userData.pid){
    const pid=h.object.userData.pid;
    const c=$('cross');c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),100);
    if(pid in conns)conns[pid].send({t:'h',to:pid,dmg:25,n:me.name});
    else if(!isHost&&conns[Object.keys(conns)[0]])conns[Object.keys(conns)[0]].send({t:'h',to:pid,dmg:25,n:me.name,id:myId});
  }
}
function damage(dmg,by){

// ---------- зброя від 1-ї особи, світло пострілу ----------
const flashLight=new THREE.PointLight(0xffaa55,0,14,2);flashLight.position.set(.3,-.1,-1.2);camera.add(flashLight);
const gun=new THREE.Group(),gm=new THREE.MeshStandardMaterial({color:0x2a2e3a,metalness:.9,roughness:.3,envMapIntensity:1.2});
const gpart=(w,h,d,x,y,z,m)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||gm);p.position.set(x,y,z);gun.add(p)};
gpart(.07,.1,.45,0,0,0);gpart(.045,.045,.35,0,.02,-.38);gpart(.06,.14,.08,0,-.1,.1);gpart(.015,.03,.02,0,.07,-.15);

gun.position.set(.26,-.24,-.5);camera.add(gun);let recoil=0;
// космічний пил
const DN=500,dP=new Float32Array(DN*3);for(let i=0;i<DN;i++){dP[i*3]=(Math.random()-.5)*80;dP[i*3+1]=Math.random()*12;dP[i*3+2]=(Math.random()-.5)*80}
const dG=new THREE.BufferGeometry();dG.setAttribute('position',new THREE.BufferAttribute(dP,3));
const dust=new THREE.Points(dG,new THREE.PointsMaterial({color:0x9fb4ff,size:.06,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));dust.frustumCulled=false;scene.add(dust);
// постобробка: HDR + bloom + кінематографічний грейд + FXAA
const GradeShader={uniforms:{tDiffuse:{value:null},time:{value:0}},
vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
 vec2 d=vUv-.5;float r=dot(d,d);vec3 c;
 c.r=texture2D(tDiffuse,vUv+d*r*.012).r;c.g=texture2D(tDiffuse,vUv).g;c.b=texture2D(tDiffuse,vUv-d*r*.012).b;
 c=aces(c*1.1);float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.15);
 c=mix(c,c*vec3(.95,1.,1.08),.5);c=pow(c,vec3(1./2.2));
 c*=1.-r*1.1;
 float n=fract(sin(dot(vUv*vec2(1731.,977.)+time,vec2(12.9898,78.233)))*43758.5453);c+=(n-.5)*.03;
 gl_FragColor=vec4(c,1.);}`};
const rtg=new THREE.WebGLRenderTarget(innerWidth*PR,innerHeight*PR,{type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
const composer=new THREE.EffectComposer(renderer,rtg);composer.setPixelRatio(PR);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.75,.65,.88);composer.addPass(bloom);
const grade=new THREE.ShaderPass(GradeShader);composer.addPass(grade);
const fxaa=new THREE.ShaderPass(THREE.FXAAShader);composer.addPass(fxaa);

var qLevel=1,camY=0,fpsAcc=0,fpsN=0,fpsBad=0;
function setQ(l){
  qLevel=l;renderer.shadowMap.enabled=l<2;sun.castShadow=l<2;
  const ms=l===0?4096:2048;
  if(sun.shadow.mapSize.x!==ms){sun.shadow.mapSize.set(ms,ms);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  bloom.enabled=l<2;
  PR=l===0?Math.min(devicePixelRatio,1.5):1;renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);composer.setPixelRatio(PR);resizeFX();
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});updInfo();
}
addEventListener('keydown',e=>{if(e.code==='KeyG'){setQ((qLevel+1)%3);feed('Графіка: '+['ультра','висока','економ'][qLevel])}});

// ---------- статуя skin.glb у центрі карти ----------
var statueNote='skin.glb: завантаження…';
let statueMixer=null;
{const sl=new THREE.SpotLight(0xffffff,3.5,45,.55,.6,1);sl.position.set(7,13,7);sl.target.position.set(0,4.5,0);scene.add(sl,sl.target)}
function fitBox(m){
  m.updateMatrixWorld(true);const b=new THREE.Box3(),v=new THREE.Vector3();
  m.traverse(o=>{
    if(!o.isMesh||!o.geometry.attributes.position)return;
    const pos=o.geometry.attributes.position,st=Math.max(1,(pos.count/60000)|0),sk=o.isSkinnedMesh&&o.skeleton&&o.boneTransform;
    if(sk)o.skeleton.update();
    for(let i=0;i<pos.count;i+=st){v.fromBufferAttribute(pos,i);if(sk)o.boneTransform(i,v);b.expandByPoint(v.applyMatrix4(o.matrixWorld))}
  });
  return b;
}
function placeStatue(m){
  let b=fitBox(m);const sz=b.getSize(new THREE.Vector3());
  const ok=!b.isEmpty()&&isFinite(sz.y)&&sz.y>1e-6;
  m.scale.setScalar(ok?3/sz.y:1);
  if(ok){b=fitBox(m);const c=b.getCenter(new THREE.Vector3());m.position.set(-c.x,3.1-b.min.y,-c.z)}else m.position.set(0,3.1,0);
  m.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;o.frustumCulled=false;worldMeshes.push(o);if(o.material){o.material.side=THREE.DoubleSide;o.material.envMapIntensity=1}}});
  scene.add(m);m.updateMatrixWorld(true);statueNote='статуя: ок';updInfo();
}
// заглушка-прибулець, якщо glb не відкрився
function alienStatue(){
  const g=new THREE.Group(),sk=new THREE.MeshStandardMaterial({color:0x6fe08a,roughness:.45,metalness:.1,emissive:0x0b3d1a,emissiveIntensity:.6}),ey=new THREE.MeshStandardMaterial({color:0,roughness:.1,metalness:.8});
  const part=(geo,mat,x,y,z,sx,sy,sz,rz)=>{const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.z=rz||0;o.castShadow=o.receiveShadow=true;g.add(o);worldMeshes.push(o)};
  const sp=new THREE.SphereGeometry(.5,24,16),cy=new THREE.CylinderGeometry(.07,.05,1,10);
  part(sp,sk,0,1.05,0,1,1.4,.8);part(sp,sk,0,2.25,0,1.2,1.4,1.1);
  part(sp,ey,-.3,2.2,-.5,.4,.22,.15,.5);part(sp,ey,.3,2.2,-.5,.4,.22,.15,-.5);
  part(cy,sk,-.6,1.2,0,1,1.1,1,.25);part(cy,sk,.6,1.2,0,1,1.1,1,-.25);
  part(cy,sk,-.2,.45,0,1.4,.9,1.4);part(cy,sk,.2,.45,0,1.4,.9,1.4);
  g.position.set(0,3.1,0);scene.add(g);
}
var statueFailed=false;
function statueFail(e){if(statueFailed)return;statueFailed=true;statueNote='skin.glb: '+((e&&e.message)||e)+' (показую заглушку)';console.warn(e);alienStatue();updInfo()}
// перепаковуємо glb: точні довжини чанків, без анімацій / морф-цілей / sparse (старий завантажувач на них ламається)
function cleanGLB(buf){
  const dv=new DataView(buf);if(dv.getUint32(0,true)!==0x46546C67)return buf;
  const jl=dv.getUint32(12,true),j=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl)).replace(/[\0\s]+$/,''));
  delete j.animations;
  (j.meshes||[]).forEach(m=>{delete m.weights;(m.primitives||[]).forEach(p=>delete p.targets)});
  (j.nodes||[]).forEach(n=>delete n.weights);(j.accessors||[]).forEach(a=>delete a.sparse);
  const bs=20+jl;let bin=new Uint8Array(0);
  if(bs+8<=buf.byteLength){const bl=dv.getUint32(bs,true);bin=new Uint8Array(buf,bs+8,Math.min(bl,buf.byteLength-bs-8))}
  const bp=bin.length?(4-bin.length%4)%4:0,t=new TextEncoder().encode(JSON.stringify(j)),jt=new Uint8Array(t.length+(4-t.length%4)%4).fill(32);jt.set(t);
  const p=20+jt.length,out=new Uint8Array(p+(bin.length?8+bin.length+bp:0)),o=new DataView(out.buffer);
  o.setUint32(0,0x46546C67,true);o.setUint32(4,2,true);o.setUint32(8,out.length,true);o.setUint32(12,jt.length,true);o.setUint32(16,0x4E4F534A,true);out.set(jt,20);
  if(bin.length){o.setUint32(p,bin.length+bp,true);o.setUint32(p+4,0x004E4942,true);out.set(bin,p+8)}
  return out.buffer;
}
let glbErr=null,glbMB='?';
function tryLoad(list){
  const b=list.shift();if(!b){statueFail(new Error((glbErr&&glbErr.message||glbErr)+' ['+glbMB+' МБ]'));return}
  const next=e=>{glbErr=e;tryLoad(list)};
  try{new THREE.GLTFLoader().parse(b,'',g=>{try{placeStatue(g.scene)}catch(e){next(e)}},next)}catch(e){next(e)}
}
fetch('skin.glb').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).then(buf=>{
  glbMB=(buf.byteLength/1048576).toFixed(1);let c=buf;try{c=cleanGLB(buf)}catch(e){glbErr=e}
  tryLoad(c===buf?[buf]:[c,buf]);
}).catch(statueFail);

// ---------- головний цикл ----------
let prev=performance.now(),sendT=0,bob=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-prev)/1000,.05);prev=now;
  const locked=document.pointerLockElement===renderer.domElement;
  if(inGame&&locked){
    const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    const r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    const sp=(keys.ShiftLeft||keys.ShiftRight)?9:5.5;
    let vx=0,vz=0;
    if(f||r){
      const l=Math.hypot(f,r),s=Math.sin(me.yaw),c=Math.cos(me.yaw);
      vx=(-s*f+c*r)/l*sp;vz=(-c*f-s*r)/l*sp;
    }
    const mv=(dx,dz)=>{me.p.x+=dx;me.p.z+=dz;if(hits(me.p)){if(me.ground){me.p.y+=.55;if(!hits(me.p))return;me.p.y-=.55}me.p.x-=dx;me.p.z-=dz}};
    mv(vx*dt,0);mv(0,vz*dt);
    if(keys.Space&&me.ground){me.vy=8;me.ground=false}
    me.vy-=24*dt;me.p.y+=me.vy*dt;me.ground=false;
    if(me.p.y<=0){me.p.y=0;me.vy=0;me.ground=true}
    for(let it=0;it<3;it++)for(const b of boxes){
      if(!(me.p.x+R>b.minx&&me.p.x-R<b.maxx&&me.p.z+R>b.minz&&me.p.z-R<b.maxz&&me.p.y<b.maxy-.001&&me.p.y+HT>b.miny))continue;
      const up=b.maxy-me.p.y,dn=me.p.y+HT-b.miny;
      const px=Math.min(me.p.x+R-b.minx,b.maxx-(me.p.x-R)),pz=Math.min(me.p.z+R-b.minz,b.maxz-(me.p.z-R)),hz=Math.min(px,pz);
      if(up<=hz&&(up<=dn||me.vy<=0)){me.p.y=b.maxy;if(me.vy<0)me.vy=0;me.ground=true}
      else if(dn<hz&&me.vy>0){me.p.y=b.miny-HT;me.vy=0}
      else if(px<pz)me.p.x+=(me.p.x<(b.minx+b.maxx)/2?-px:px);
      else me.p.z+=(me.p.z<(b.minz+b.maxz)/2?-pz:pz);
    }
    me.p.x=Math.max(-H+R,Math.min(H-R,me.p.x));me.p.z=Math.max(-H+R,Math.min(H-R,me.p.z));
    if(me.p.y<-30)spawn();
    bob+=(f||r)&&me.ground?dt*(sp>6?14:10):0;
    cool-=dt;if(mouseDown&&cool<=0){shoot();cool=.15}
  }
  if(me.ground&&Math.abs(me.p.y-camY)<.9)camY+=(me.p.y-camY)*(1-Math.exp(-28*dt));else camY=me.p.y;
  camera.position.set(me.p.x,camY+EYE+Math.sin(bob)*.04,me.p.z);
  camera.rotation.set(me.pitch,me.yaw,0);
  sky.position.copy(camera.position);

  sendT+=dt;
  if(sendT>.05&&inGame){sendT=0;if(Object.keys(conns).length)send({t:'s',p:[me.p.x,me.p.y,me.p.z],y:me.yaw,n:me.name,h:myHue})}

  const t=performance.now();
  for(const id in remotes){
    const r=remotes[id];
    if(t-r.last>6000){removePlayer(id);continue}
    const old=r.g.position.clone();
    r.g.position.lerp(r.tp,1-Math.exp(-14*dt));
    let dy=r.tyaw-r.g.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));r.g.rotation.y+=dy*(1-Math.exp(-14*dt));
    const spd=old.setY(0).distanceTo(new THREE.Vector3(r.g.position.x,0,r.g.position.z))/dt;
    if(spd>.5){r.phase+=dt*Math.min(spd,9)*1.6;r.legL.rotation.x=Math.sin(r.phase)*.8;r.legR.rotation.x=-Math.sin(r.phase)*.8}
    else{r.legL.rotation.x=r.legR.rotation.x=0}
  }
  for(let i=tracers.length-1;i>=0;i--){
    const k=tracers[i];k.t-=dt;k.l.material.opacity=Math.max(0,k.t/.12);
    if(k.t<=0){scene.remove(k.l);k.l.geometry.dispose();tracers.splice(i,1)}
  }
  flashLight.intensity*=Math.exp(-35*dt);recoil*=Math.exp(-14*dt);
  gun.position.z=-.5+recoil*.07;gun.rotation.x=recoil*.1;gun.position.y=-.24+Math.sin(bob)*.006;
  for(let i=0;i<SN;i++)if(spL[i]>0){spL[i]-=dt;spV[i*3+1]-=14*dt;for(let a=0;a<3;a++)spP[i*3+a]+=spV[i*3+a]*dt;if(spL[i]<=0)spP[i*3+1]=-999}
  spG.attributes.position.needsUpdate=true;
  dust.rotation.y+=dt*.01;dust.position.y=Math.sin(now*.0004)*.6;
  if(statueMixer)statueMixer.update(dt);
  if(inGame&&locked){fpsAcc+=dt;fpsN++;if(fpsAcc>2){const fr=fpsN/fpsAcc;fpsBad=fr<40?fpsBad+1:0;if(fpsBad>=2&&qLevel<2){setQ(qLevel+1);feed('Графіку автоматично знижено: '+['ультра','висока','економ'][qLevel]);fpsBad=0}fpsAcc=fpsN=0}}
  grade.uniforms.time.value=(now%1000)/1000;
  composer.render();
}
requestAnimationFrame(loop);
