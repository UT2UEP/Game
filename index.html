<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Baseplate Statue Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #menu {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.85); color: #222;
            padding: 10px 14px; border-radius: 6px; font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: opacity 0.3s;
        }
        input { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; width: 130px; }
        button { padding: 4px 10px; background: #2b2b2b; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; display: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px #000;
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #hp-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 220px; height: 18px; background: rgba(0, 0, 0, 0.6);
            border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
        }
        #hp-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.15s, background 0.2s; }
        #hp-text {
            position: absolute; top: 0; left: 0; width: 100%; text-align: center;
            color: #fff; font-size: 12px; line-height: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000;
        }
        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.35); pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="damage-flash"></div>

<div id="menu">
    <div>Твій ID: <b id="my-id">...</b></div>
    <div style="margin-top: 6px;">
        <input type="text" id="friend-id" placeholder="ID хоста">
        <button id="connect-btn">Підключитись</button>
    </div>
    <div id="status" style="margin-top: 6px; color: #d35400; font-weight: bold; font-size: 11px;">Очікування підключення...</div>
    <div style="margin-top: 4px; color: #555; font-size: 10px;">WASD — рух | ЛКМ — стрільба</div>
</div>

<div id="crosshair"></div>

<div id="hp-container">
    <div id="hp-bar"></div>
    <div id="hp-text">100 HP</div>
</div>

<script>
    // Посилання на твою модель-статую у центрі карти (через CDN jsDelivr для гарантованого завантаження)
    const STATUE_URL = 'https://cdn.jsdelivr.net/gh/UT2UEP/Game@main/skin.glb';
    const STATUE_SCALE = 1.5; // Можеш змінити розмір статуї тут

    // 1. СЦЕНА ТА ОСВІТЛЕННЯ
    const scene = new THREE.Scene();
    const loader = new THREE.TextureLoader();
    const texture = loader.load('space.jpg');
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = texture;

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 30, 15);
    scene.add(dirLight);

    // 2. ПЛАТФОРМА ТА УКРИТТЯ
    const floorSize = 100;
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(floorSize, floorSize),
        new THREE.MeshLambertMaterial({ color: 0x888888 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const boxMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    const coverPositions = [
        [8, 1.2, 0], [-8, 1.2, 0], [0, 1.2, -10], [0, 1.2, 10], [12, 1.2, -12], [-12, 1.2, 12]
    ];
    coverPositions.forEach(pos => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 3), boxMat);
        box.position.set(pos[0], pos[1], pos[2]);
        scene.add(box);
    });

    // 3. СТАТУЯ ПОСЕРЕДИНИ КАРТИ (Твій skin.glb)
    const statueGroup = new THREE.Group();
    statueGroup.position.set(0, 0, 0); // Центр карти (0, 0, 0)
    scene.add(statueGroup);

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(STATUE_URL, function (gltf) {
        const model = gltf.scene;
        model.scale.set(STATUE_SCALE, STATUE_SCALE, STATUE_SCALE);
        statueGroup.add(model);
        console.log("Статую успішно встановлено в центрі карти!");
    }, undefined, function (error) {
        console.error("Помилка завантаження статуї:", error);
    });

    // 4. ГРАВЕЦЬ (КУБИК) ТА ЗДОРОВ'Я
    const player = {
        x: 0, y: 0, z: 15,
        vx: 0, vy: 0, vz: 0,
        walkSpeed: 0.15,
        runSpeed: 0.28,
        jumpForce: 0.28,
        gravity: 0.014,
        onGround: false,
        hp: 100
    };

    // Створюємо візуальний кубик для себе (видно з 3-ї особи)
    const myCube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.8, 1),
        new THREE.MeshLambertMaterial({ color: 0x3498db }) // Синенький кубик для тебе
    );
    scene.add(myCube);

    function updateHPUI() {
        const bar = document.getElementById('hp-bar');
        const text = document.getElementById('hp-text');
        bar.style.width = Math.max(0, player.hp) + '%';
        text.innerText = Math.max(0, player.hp) + ' HP';
        bar.style.background = player.hp > 50 ? '#2ecc71' : (player.hp > 25 ? '#f1c40f' : '#e74c3c');
    }

    function takeDamage(amount) {
        player.hp -= amount;
        updateHPUI();
        const flash = document.getElementById('damage-flash');
        flash.style.opacity = '1';
        setTimeout(() => flash.style.opacity = '0', 150);

        if (player.hp <= 0) {
            player.hp = 100;
            updateHPUI();
            player.x = (Math.random() - 0.5) * 40;
            player.z = (Math.random() - 0.5) * 40;
            player.y = 5;
        }
    }

    // Кубик для друга
    const friendCube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.8, 1),
        new THREE.MeshLambertMaterial({ color: 0xe74c3c }) // Червоненький кубик для друга
    );
    friendCube.visible = false;
    scene.add(friendCube);

    // 5. КЕРУВАННЯ ТА СТРІЛЬБА
    let yaw = 0, pitch = 0;
    const keys = {};
    const raycaster = new THREE.Raycaster();

    renderer.domElement.addEventListener('click', () => {
        if (document.pointerLockElement !== renderer.domElement) {
            renderer.domElement.requestPointerLock();
        }
    });

    document.addEventListener('pointerlockchange', () => {
        const locked = document.pointerLockElement === renderer.domElement;
        document.getElementById('menu').style.opacity = locked ? '0' : '1';
        document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
    });

    window.addEventListener('mousedown', (e) => {
        if (e.button === 0 && document.pointerLockElement === renderer.domElement) shoot();
    });

    function createTracer(startPos, endPos, color = 0xffff00) {
        const geo = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: color }));
        scene.add(line);
        setTimeout(() => scene.remove(line), 80);
    }

    function shoot() {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const startPos = camera.position.clone();

        let hitFriend = false;
        let hitPoint = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 60);

        if (friendCube.visible) {
            const intersects = raycaster.intersectObject(friendCube, true);
            if (intersects.length > 0) {
                hitFriend = true;
                hitPoint = intersects[0].point;
            }
        }

        createTracer(startPos, hitPoint, hitFriend ? 0xff0000 : 0xffee55);

        if (conn && conn.open) {
            conn.send({
                type: 'shoot',
                start: startPos,
                end: hitPoint,
                hit: hitFriend,
                damage: 25
            });
        }
    }

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.0022;
            pitch -= e.movementY * 0.0022;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
    });

    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
        }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    // 6. МУЛЬТИПЛЕЄР
    const HOST_ID = 'ut2uep-baseplate-host';
    let peer = new Peer(HOST_ID);
    let conn = null;

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('friend-id').value = HOST_ID;
            });
        }
    });

    peer.on('connection', (c) => {
        conn = c;
        setupConn();
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
        const fid = document.getElementById('friend-id').value.trim();
        if (fid) {
            conn = peer.connect(fid);
            setupConn();
        }
    });

    function setupConn() {
        if (!conn) return;

        conn.on('open', () => {
            document.getElementById('status').innerText = "Гравець підключений!";
            document.getElementById('status').style.color = "#2ecc71";
            friendCube.visible = true;
        });

        if (conn.open) {
            document.getElementById('status').innerText = "Гравець підключений!";
            document.getElementById('status').style.color = "#2ecc71";
            friendCube.visible = true;
        }

        conn.on('data', (data) => {
            if (data.type === 'move') {
                friendCube.position.set(data.x, data.y + 0.9, data.z);
                friendCube.rotation.y = data.ry;
                friendCube.visible = true;
            } else if (data.type === 'shoot') {
                const start = new THREE.Vector3(data.start.x, data.start.y, data.start.z);
                const end = new THREE.Vector3(data.end.x, data.end.y, data.end.z);
                createTracer(start, end, 0xff5500);
                if (data.hit) takeDamage(data.damage);
            }
        });

        conn.on('close', () => {
            friendCube.visible = false;
            document.getElementById('status').innerText = "З'єднання втрачено";
            document.getElementById('status').style.color = "#e74c3c";
        });
    }

    // 7. ГОЛОВНИЙ ЦИКЛ
    function animate() {
        requestAnimationFrame(animate);

        const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? player.runSpeed : player.walkSpeed;
        const input = new THREE.Vector3();
        if (keys['KeyW']) input.z -= 1;
        if (keys['KeyS']) input.z += 1;
        if (keys['KeyA']) input.x -= 1;
        if (keys['KeyD']) input.x += 1;

        if (input.length() > 0) {
            input.normalize();
            input.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            player.vx = input.x * speed;
            player.vz = input.z * speed;
        } else {
            player.vx *= 0.75;
            player.vz *= 0.75;
        }

        player.vy -= player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.z += player.vz;

        if (player.y <= 0) {
            player.y = 0;
            player.vy = 0;
            player.onGround = true;
        }

        const limit = floorSize / 2 - 2;
        player.x = Math.max(-limit, Math.min(limit, player.x));
        player.z = Math.max(-limit, Math.min(limit, player.z));

        // Оновлюємо позицію нашого кубика-гравця
        myCube.position.set(player.x, player.y + 0.9, player.z);
        myCube.rotation.y = yaw;

        // Камера від 3-ї особи позаду кубика
        const dist = 5.0;
        const height = 2.5;
        camera.position.x = player.x + Math.sin(yaw) * dist;
        camera.position.y = player.y + height;
        camera.position.z = player.z + Math.cos(yaw) * dist;
        camera.lookAt(player.x, player.y + 1.0, player.z);

        if (conn && conn.open) {
            conn.send({ type: 'move', x: player.x, y: player.y, z: player.z, ry: yaw });
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
