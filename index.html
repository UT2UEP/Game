<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Custom Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #menu {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.85); color: #222;
            padding: 10px 14px; border-radius: 6px; font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: opacity 0.3s;
        }
        input { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; width: 130px; }
        button { padding: 4px 10px; background: #2b2b2b; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        #dot {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(0,0,0,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            display: none; /* Ховається, коли меню активне */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="menu">
    <div>ID: <b id="my-id">...</b></div>
    <div style="margin-top: 6px;">
        <input type="text" id="friend-id" placeholder="ID друга">
        <button onclick="connect()">OK</button>
    </div>
    <div id="status" style="margin-top: 4px; color: #555; font-size: 11px;">WASD — ходити | Shift — біг | Space — стрибок</div>
    <div style="margin-top: 6px; font-size: 11px; color: blue; cursor: pointer;" onclick="toggleInstructions()">[Як грати вдвох?]</div>
    <div id="instructions" style="display:none; margin-top: 5px; font-size: 10px; color: #666;">
        1. Ти перший заходиш (твій ID завжди ut2uep-host, якщо вільно).<br>
        2. Друг заходить, у нього в полі вводу автоматично з'явиться твій ID.<br>
        3. Друг тисне "OK". Все.<br>
        4. Якщо ви обоє бачите "...", перезавантажте сторінку.
    </div>
</div>
<div id="dot"></div>

<script>
    // 1. СЦЕНА ТА ФОНОВА КАРТИНКА
    const scene = new THREE.Scene();
    const loader = new THREE.TextureLoader();
    
    // --- ЗАМЕНИ ЦЕЙ ЛІНК НА СВІЙ ---
    // Можеш знайти в Google картинку "cubemap skybox" або "panoramic background"
    const texture = loader.load('space.jpg');
    
    texture.mapping = THREE.EquirectangularReflectionMapping; // Робить панораму
    scene.background = texture;

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding; // Для коректних кольорів текстур
    document.body.appendChild(renderer.domElement);

    // Освітлення
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(0, 20, 10);
    scene.add(dirLight);

    // 2. ЧИСТА ПЛАТФОРМА (без сітки)
    const floorSize = 100; // Зробили трохи більше
    const floorGeo = new THREE.PlaneGeometry(floorSize, floorSize);
    // Стандартний сірий колір підлоги, без GridHelper
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x999999 }); 
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2; // Кладемо горизонтально
    floor.position.y = -0.1; // Трохи нижче нуля
    scene.add(floor);

    // 3. ФІЗИКА ТА КЕРУВАННЯ
    const player = {
        x: 0, y: 1.7, z: 5,
        vx: 0, vy: 0, vz: 0,
        eyeHeight: 1.7,
        walkSpeed: 0.15,
        runSpeed: 0.3,
        jumpForce: 0.28,
        gravity: 0.014,
        onGround: false
    };

    let yaw = 0, pitch = 0;
    const keys = {};
    let menuVisible = true;

    renderer.domElement.addEventListener('click', () => {
        renderer.domElement.requestPointerLock();
        if (menuVisible) {
            document.getElementById('menu').style.opacity = '0';
            document.getElementById('dot').style.display = 'block';
            menuVisible = false;
        }
    });

    document.addEventListener('pointerlockchange', () => {
        if (!document.pointerLockElement) {
            document.getElementById('menu').style.opacity = '1';
            document.getElementById('dot').style.display = 'none';
            menuVisible = true;
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.0022;
            pitch -= e.movementY * 0.0022;
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
        }
    });

    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
        }
        if (e.code === 'KeyR') { // Кнопка R для респавна, якщо застряг
            player.x = 0; player.y = player.eyeHeight; player.z = 5;
            player.vx = 0; player.vy = 0; player.vz = 0;
        }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    function toggleInstructions() {
        const instr = document.getElementById('instructions');
        if (instr.style.display === 'none') instr.style.display = 'block';
        else instr.style.display = 'none';
    }

    // 4. МУЛЬТИПЛЕЄР
    const HOST_ID = 'ut2uep-baseplate-host';
    let peer = new Peer(HOST_ID);
    let conn = null;

    const friendGroup = new THREE.Group();
    // Робимо друга трохи більш помітним на фоні картинки
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
    torso.position.y = 0.9;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xffff00 }));
    head.position.y = 1.7;
    friendGroup.add(torso, head);
    friendGroup.visible = false;
    scene.add(friendGroup);

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('friend-id').value = HOST_ID;
            });
        }
    });

    peer.on('connection', (c) => { conn = c; setupConn(); });

    function connect() {
        const fid = document.getElementById('friend-id').value.trim();
        if (fid) {
            conn = peer.connect(fid);
            setupConn();
        }
    }

    function setupConn() {
        document.getElementById('status').innerText = "Гравець підключений";
        friendGroup.visible = true;
        conn.on('data', (data) => {
            friendGroup.position.set(data.x, data.y - player.eyeHeight, data.z);
            friendGroup.rotation.y = data.ry;
        });
        // Додаємо надійність: якщо зв'язок розірвано, ховаємо друга
        conn.on('close', () => { friendGroup.visible = false; document.getElementById('status').innerText = "З'єднання втрачено"; });
    }

    // 5. ІГРОВИЙ ЦИКЛ
    function animate() {
        requestAnimationFrame(animate);

        const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? player.runSpeed : player.walkSpeed;
        const input = new THREE.Vector3();
        if (keys['KeyW']) input.z -= 1;
        if (keys['KeyS']) input.z += 1;
        if (keys['KeyA']) input.x -= 1;
        if (keys['KeyD']) input.x += 1;

        if (input.length() > 0) {
            input.normalize();
            input.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            player.vx = input.x * speed;
            player.vz = input.z * speed;
        } else {
            player.vx *= 0.75; // Трохи повільніша зупинка
            player.vz *= 0.75;
        }

        player.vy -= player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.z += player.vz;

        // Підлога
        if (player.y <= player.eyeHeight) {
            player.y = player.eyeHeight;
            player.vy = 0;
            player.onGround = true;
        }

        // Межі (збільшили, щоб відповідало розміру підлоги)
        const limit = floorSize / 2 - 2;
        player.x = Math.max(-limit, Math.min(limit, player.x));
        player.z = Math.max(-limit, Math.min(limit, player.z));

        camera.position.set(player.x, player.y, player.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        if (conn && conn.open) {
            conn.send({ x: player.x, y: player.y, z: player.z, ry: yaw });
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
